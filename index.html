<!DOCTYPE html>
<html>
  <head>
    <title>Socket.IO chat</title>
    <style>
      body {
        margin: 0;
        padding-bottom: 3rem;
        font-family: sans-serif;
      }

      #form {
        background: rgba(0, 0, 0, 0.15);
        padding: 0.25rem;
        position: fixed;
        bottom: 0;
        left: 0;
        right: 0;
        display: flex;
        height: 3rem;
        box-sizing: border-box;
        backdrop-filter: blur(10px);
      }
      #input {
        border: none;
        padding: 0 1rem;
        flex-grow: 1;
        border-radius: 2rem;
        margin: 0.25rem;
      }
      #input:focus {
        outline: none;
      }
      #form > button {
        background: #333;
        border: none;
        padding: 0 1rem;
        margin: 0.25rem;
        border-radius: 3px;
        outline: none;
        color: #fff;
      }

      #messages {
        list-style-type: none;
        margin: 0;
        padding: 0;
      }
      #messages > li {
        padding: 0.5rem 1rem;
      }
      #messages > li:nth-child(odd) {
        background: #efefef;
      }

      #status {
        position: fixed;
        bottom: 40px;
        left: 0;
        right: 0;
        padding: 0 10px;
        color: #999;
      }

      #users {
        position: absolute;
        top: 0;
        right: 0;
        padding-right: 1rem;
        background: #fff;
        margin: 0;
        border-left: 1px solid #eee;
        box-shadow: 0 0 5px rgba(0, 0, 0, 0.1);
        padding: 1rem 2rem;
      }

      #users li.offline::marker {
        color: red;
      }
      #users li.online::marker {
        color: green;
      }
    </style>
  </head>
  <body>
    <ul id="messages"></ul>
    <p id="status"></p>
    <form id="form" action="">
      <input id="input" autocomplete="off" /><button>Send</button>
    </form>
    <aside>
      <ul id="users">
        <li class="offline">Marta</li>
        <li class="offline">Jordi</li>
        <li class="offline">Pedro</li>
        <li class="offline">Ana</li>
        <li class="offline">Lucía</li>
        <li class="offline">Martín</li>
      </ul>
    </aside>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.6.1/socket.io.min.js"></script>
    <script>
      //var socket = io("https://websockets-tsll.onrender.com");
      var socket = io("localhost:3333");

      const form = document.getElementById("form");
      const input = document.getElementById("input");
      const messageList = document.getElementById("messages");
      const statusMsg = document.getElementById("status");
      const userList = document.getElementById("users");
      users = userList.querySelectorAll("li");

      let nickname = prompt("¿Cuál es tu nombre?");

      socket.emit("login", { nickname: nickname });
      socket.on("signin", function (user) {
        let item = document.createElement("li");
        item.innerText = "👨 " + user.nickname + " acaba de entrar ";
        messageList.append(item);
        [...users].map((item) => {
          if (item.innerText === user.nickname) {
            console.log("this", item);
            item.classList.toggle("offline");
            item.classList.toggle("online");
          }
        });
      });

      form.addEventListener("submit", function (e) {
        e.preventDefault();
        socket.emit("msg", { nickname: nickname, msg: input.value });
      });

      input.addEventListener("keypress", function (e) {
        console.log("Usuario está escribiendo");
        socket.emit("status", { nickname: nickname, status: "writting" });
      });

      socket.on("msg", function (msg) {
        console.log("He recibido un mensaje", msg.msg);
        let item = document.createElement("li");
        item.innerText = "💌 " + msg.nickname + ": " + msg.msg;
        messageList.append(item);
      });

      socket.on("userConnection", (msg) => {
        let item = document.createElement("li");
        item.innerText = "👨 " + msg.msg;
        messageList.append(item);
      });

      socket.on("status", (status) => {
        console.log("status", status);
        switch (status.status) {
          case "writting":
            statusMsg.innerText = status.nickname + " está escribiendo";
            break;
          default:
        }
      });
    </script>
  </body>
</html>
